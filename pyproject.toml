[project]
name = "varta"
version = "2.0.0"
description = "Vārtā — personal finance and investing advisor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "polars>=1.0",
  "pyarrow>=16",
  "yfinance>=0.2.66",
  "cryptography>=43",
  "httpx>=0.27",
  "openai>=3.29.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pyyaml>=6.0.3",
  "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
