# Run: docker compose -f deploy/compose.yaml --env-file deploy/caddy.env --profile demo [--profile owner] up -d
# --env-file feeds interpolation (PUBLIC_IP, OWNER_TS_IP, Caddy vars); per-instance secrets come from demo.env / owner.env.
# Only caddy publishes ports. If only one profile runs, the other site's upstream is unresolved and
# errors per request (502) -- acceptable.
x-api: &api
  build: {context: .., dockerfile: Dockerfile}
  image: varta-api
  restart: unless-stopped

x-web: &web
  build: {context: ../web}
  image: varta-web
  restart: unless-stopped

services:
  api-demo:
    <<: *api
    profiles: [demo]
    env_file: demo.env
    networks: [demo]
    environment: {VARTA_INSTANCE: demo, TRUST_PROXY: "1"}
    volumes: [demo-data:/data]
  worker-demo:
    <<: *api
    profiles: [demo]
    command: ["python", "-m", "worker.main"]
    healthcheck: {disable: true}  # image HEALTHCHECK targets the api port
    env_file: demo.env
    networks: [demo]
    environment: {VARTA_INSTANCE: demo}
    volumes: [demo-data:/data]
  web-demo:
    <<: *web
    profiles: [demo]
    networks: [demo]
    environment: {API_URL: "http://api-demo:8000", VARTA_INSTANCE: demo}

  api-owner:
    <<: *api
    profiles: [owner]
    env_file: owner.env
    networks: [owner]
    environment: {VARTA_INSTANCE: owner, TRUST_PROXY: "1"}
    volumes: [owner-data:/data]
  worker-owner:
    <<: *api
    profiles: [owner]
    command: ["python", "-m", "worker.main"]
    healthcheck: {disable: true}  # image HEALTHCHECK targets the api port
    env_file: owner.env
    networks: [owner]
    environment: {VARTA_INSTANCE: owner}
    volumes: [owner-data:/data]
  web-owner:
    <<: *web
    profiles: [owner]
    networks: [owner]
    environment: {API_URL: "http://api-owner:8000", VARTA_INSTANCE: owner}

  caddy:
    image: caddy:2.10
    profiles: [demo, owner]
    restart: unless-stopped
    env_file: caddy.env
    networks: [demo, owner]
    ports:
      - "${PUBLIC_IP:?set PUBLIC_IP in deploy/caddy.env}:80:80"
      - "${PUBLIC_IP:?set PUBLIC_IP in deploy/caddy.env}:443:443"
      # Owner site listens on container 8443; published only on the Tailscale IP.
      - "${OWNER_TS_IP:?set OWNER_TS_IP in deploy/caddy.env}:443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - caddy-data:/data
      - caddy-config:/config

networks:
  demo:
  owner:

volumes:
  demo-data:
  owner-data:
  caddy-data:
  caddy-config:
