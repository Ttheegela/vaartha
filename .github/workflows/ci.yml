name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api && git diff --exit-code lib/api-types.ts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose config from examples
        run: |
          for f in demo owner caddy; do cp deploy/$f.env.example deploy/$f.env; done
          C="docker compose -f deploy/compose.yaml --env-file deploy/caddy.env --profile demo --profile owner config -q"
          if $C; then echo "unfilled IPs must fail closed"; exit 1; fi
          sed -i 's/^PUBLIC_IP=.*/PUBLIC_IP=203.0.113.10/;s/^OWNER_TS_IP=.*/OWNER_TS_IP=100.64.0.10/' deploy/caddy.env
          $C
      - run: docker build -t varta-api .
      - run: docker build -t varta-web web
